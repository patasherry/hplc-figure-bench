name: Queue leader

# Rule-based router and merger (no AI, no Claude tokens). See .github/scripts/queue-leader.js.
# Until 2026-11-12 this also drove Google Jules through its API; Jules went read-only on 11-11.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled]
  # GitHub often delays or skips scheduled runs, so the leader also wakes on a finished Test suite run, to merge.
  workflow_run:
    workflows: ['Test suite']
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  lead:
    if: github.event_name != 'issues' || github.event.label.name == 'queued' || github.event.label.name == 'jules-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one leader at a time; the heartbeat below waits outside this lock
    concurrency:
      group: queue-leader
      cancel-in-progress: false
    outputs:
      active: ${{ steps.lead.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: lead
        uses: actions/github-script@v7
        with:
          script: |
            const lead = require('./.github/scripts/queue-leader.js');
            await lead({github, context, core});

  # While work is queued or routed, wait a few minutes and start the leader again.
  # This job has its own concurrency group, so the leader is free to run on events while it waits,
  # and a newer wait replaces an older one (only one chain at a time). Actions minutes are free on public repositories.
  heartbeat:
    needs: lead
    if: needs.lead.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: queue-leader-heartbeat
      cancel-in-progress: true
    steps:
      - name: Check again in 3 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 180
          gh workflow run queue-leader.yml --repo "$GITHUB_REPOSITORY" --ref main

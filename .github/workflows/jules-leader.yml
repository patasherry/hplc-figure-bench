name: Jules leader

# Rule-based supervisor for Jules (no AI, no Claude tokens). See .github/scripts/jules-leader.js.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled]

concurrency:
  group: jules-leader
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  lead:
    if: github.event_name != 'issues' || github.event.label.name == 'jules-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          script: |
            const lead = require('./.github/scripts/jules-leader.js');
            await lead({github, context, core});

name: Jules leader

# Rule-based supervisor for Jules (no AI, no Claude tokens). See .github/scripts/jules-leader.js.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled]
  # GitHub often delays or skips scheduled runs, so the leader also wakes on activity:
  # a finished Test suite run (to merge), and comments from Jules (to see finished or failed sessions).
  workflow_run:
    workflows: ['Test suite']
    types: [completed]
  issue_comment:
    types: [created]

concurrency:
  group: jules-leader
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  lead:
    if: (github.event_name != 'issues' || github.event.label.name == 'jules-queue') && (github.event_name != 'issue_comment' || contains(github.event.comment.user.login, 'jules'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: lead
        uses: actions/github-script@v7
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          script: |
            const lead = require('./.github/scripts/jules-leader.js');
            await lead({github, context, core});
      # While Jules has queued or running work, wait 10 minutes and run the leader again.
      # Public repositories get Actions minutes free, so this costs nothing.
      - name: Check again in 10 minutes
        if: steps.lead.outputs.active == 'true' && github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          # if another leader run is already waiting, it will do the next check, so do not start a second chain
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow jules-leader.yml --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"in_progress\"))] | length")
          if [ "$waiting" = "0" ]; then gh workflow run jules-leader.yml --repo "$GITHUB_REPOSITORY" --ref main; else echo "another leader run is waiting, not starting a new one"; fi
